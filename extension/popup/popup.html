<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 14px; width: 300px; color: #e5e7eb; background: #111827; }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #6b7280; }
  .dot.on { background: #22c55e; }
  label { display: block; margin-top: 10px; color: #9ca3af; font-size: 12px; }
  input { width: 100%; box-sizing: border-box; margin-top: 3px; padding: 6px 8px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #f9fafb; font: inherit; }
  button { margin-top: 12px; padding: 7px 12px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font: inherit; cursor: pointer;
           transition: background-color .15s, transform .06s, box-shadow .15s, opacity .15s; }
  button.secondary { background: #374151; margin-left: 6px; }
  button:hover:not(:disabled) { background: #1d4ed8; }
  button.secondary:hover:not(:disabled) { background: #4b5563; }
  button:active:not(:disabled) { transform: translateY(1px) scale(.97); box-shadow: inset 0 2px 5px rgba(0, 0, 0, .45); }
  button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
  button:disabled { cursor: progress; }
  button.busy { opacity: .7; }
  button.ok { background: #16a34a; cursor: default; }
  button.fail { background: #dc2626; cursor: default; }
  .status { margin-top: 10px; color: #9ca3af; font-size: 12px; min-height: 16px; }
  .controllers { margin-top: 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .pill { display: inline-flex; align-items: center; padding: 2px 3px 2px 8px; border-radius: 999px; color: #fff; font-size: 11px; }
  button.stop { width: 18px; height: 18px; margin: 0 0 0 4px; padding: 0; border: 0; border-radius: 4px; background: rgba(255, 255, 255, .14); color: inherit;
                display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; transition: background-color .15s, opacity .15s; }
  button.stop:hover:not(:disabled) { background: rgba(255, 255, 255, .28); }
  button.stop:active:not(:disabled) { background: rgba(255, 255, 255, .36); transform: none; box-shadow: none; }
  button.stop:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  button.stop:disabled { cursor: default; opacity: .45; }
  button.stop svg { width: 10px; height: 10px; fill: currentColor; }
  code { color: #d1d5db; }
</style>
</head>
<body>
  <h1><span class="dot" id="dot"></span> Browser Hub Agent</h1>
  <label>This browser's name (what agents select it by)
    <input id="name" placeholder="e.g. work, personal">
  </label>
  <label>Hub URL
    <input id="hubUrl" placeholder="ws://127.0.0.1:8777/ext">
  </label>
  <label>Shared token (optional, must match the hub's BROWSER_HUB_TOKEN)
    <input id="token" type="password" autocomplete="off">
  </label>
  <button id="save">Save &amp; reconnect</button>
  <button id="reconnect" class="secondary">Reconnect</button>
  <div class="status" id="status"></div>
  <div class="controllers" id="controllers"></div>
  <script src="popup.js"></script>
</body>
</html>
